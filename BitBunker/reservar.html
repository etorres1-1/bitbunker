<!DOCTYPE html>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="index.html">Vivos Catalunya</a>

</div>

</nav>

<section class="container mt-5">

<h1 class="text-center mb-4">Reserva el teu Búnquer</h1>

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card p-4 shadow">

<h4 id="bunkerSeleccionat"></h4>

<form onsubmit="confirmarReserva(event)">

<div class="mb-3">

<label class="form-label">Nom complet</label>

<input type="text" class="form-control" required>

</div>

<div class="mb-3">

<label class="form-label">Email</label>

<input type="email" class="form-control" required>

</div>

<div class="mb-3">

<label class="form-label">Número de persones</label>

<input type="number" class="form-control">

</div>

<button class="btn btn-success w-100">

Confirmar reserva

</button>

</form>

</div>

</div>

</div>

</section>
